<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework Portal - Parent View</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PWA & Android Settings -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007bff">
      
  <!-- iOS (Apple Safari) Specific Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Homework Portal">
  <link rel="apple-touch-icon" href="./icon-192.png">
      
  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registered:', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Homework Portal</h1>
        <p class="text-xs text-indigo-200">Aditya Thaksh International School</p>
      </div>
      <nav class="flex gap-2">
        <a href="index.html" class="px-3 py-1.5 rounded-md bg-white text-indigo-900 font-medium text-xs shadow">Parent Portal</a>
        <a href="teacher.html" class="px-3 py-1.5 rounded-md bg-indigo-800 text-indigo-200 hover:text-white font-medium text-xs transition-all">Teacher Login</a>
        <a href="principal.html" class="px-3 py-1.5 rounded-md bg-indigo-800 text-indigo-200 hover:text-white font-medium text-xs transition-all">Principal Login</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <h2 class="text-xl font-bold text-slate-800">Approved Daily Agenda</h2>
      <div class="flex flex-wrap gap-3 w-full sm:w-auto">
        <input type="date" id="parentFilterDate" onchange="listenToParentData()" class="px-3 py-2 border rounded-lg text-sm outline-none">
        
        <select id="parentFilterGrade" onchange="listenToParentData()" class="px-3 py-2 border rounded-lg text-sm outline-none">
          <option value="ALL">All Grades</option>
          <option value="K1">K1</option>
          <option value="K2">K2</option>
          <option value="Grade 1">Grade 1</option>
          <option value="Grade 2">Grade 2</option>
          <option value="Grade 3">Grade 3</option>
          <option value="Grade 4">Grade 4</option>
          <option value="Grade 5">Grade 5</option>
          <option value="Grade 6">Grade 6</option>
          <option value="Grade 7">Grade 7</option>
          <option value="Grade 8">Grade 8</option>
          <option value="Grade 9">Grade 9</option>
          <option value="Grade X">Grade X</option>
        </select>

        <select id="parentFilterSection" onchange="listenToParentData()" class="px-3 py-2 border rounded-lg text-sm outline-none">
          <option value="ALL">All Sections</option>
          <option value="Orchid">Orchid</option>
          <option value="Tulip">Tulip</option>
          <option value="Daffodil">Daffodil</option>
        </select>
      </div>
    </div>

    <div id="parentList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Firestore Items Render Here -->
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBesKlVSBr7a4ClbJ8yLQmFSlkJqDJeuVE",
      authDomain: "homework-9b801.firebaseapp.com",
      projectId: "homework-9b801",
      storageBucket: "homework-9b801.firebasestorage.app",
      messagingSenderId: "718017176358",
      appId: "1:718017176358:web:1842b4a3372c1c170257e7",
      measurementId: "G-XM82NFGJDF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const homeworkCol = collection(db, "homeworks");
    let parentUnsub = null;

    // Mapping to enforce strict grade hierarchy when sorting
    const gradeHierarchy = [
      "K1", "K2", 
      "Grade 1", "Grade 2", "Grade 3", "Grade 4", "Grade 5", 
      "Grade 6", "Grade 7", "Grade 8", "Grade 9", "Grade X"
    ];

    // Helper function rendering links side-by-side using inline-flex
    function formatHomeworkContent(text) {
      if (!text) return '';

      const urlRegex = /(https?:\/\/[^\s]+)/g;

      return text.replace(urlRegex, (url) => {
        // Strip trailing punctuation if attached to URL
        const cleanUrl = url.replace(/[.,;)]$/, '');

        // Google Drive Link -> Inline Side-by-Side Button
        if (cleanUrl.includes('drive.google.com')) {
          return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-2.5 py-1 my-0.5 mr-1.5 bg-indigo-50 text-indigo-700 font-semibold text-xs rounded border border-indigo-200 hover:bg-indigo-100 transition-all">📁 Open Attachment ↗</a>`;
        }

        // Standard Web Links -> Inline Clickable Link
        return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer" class="text-indigo-600 font-medium underline break-all hover:text-indigo-800">${cleanUrl}</a>`;
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('parentFilterDate').value = today;
      listenToParentData();
    });

    window.listenToParentData = function() {
      if (parentUnsub) parentUnsub();
      const selectedDate = document.getElementById('parentFilterDate').value;
      const selectedGrade = document.getElementById('parentFilterGrade').value;
      const selectedSection = document.getElementById('parentFilterSection').value;

      const q = query(homeworkCol, where("date", "==", selectedDate), where("status", "==", "approved"));

      parentUnsub = onSnapshot(q, (snapshot) => {
        const container = document.getElementById('parentList');
        container.innerHTML = '';
        let items = [];
        snapshot.forEach(docSnap => items.push({ id: docSnap.id, ...docSnap.data() }));

        if (selectedGrade !== 'ALL') {
          items = items.filter(item => item.grade === selectedGrade);
        }

        if (selectedSection !== 'ALL') {
          items = items.filter(item => item.sections && item.sections.includes(selectedSection));
        }

        if (items.length === 0) {
          container.innerHTML = `<div class="col-span-full bg-white p-8 rounded-xl text-center text-slate-500">No homework posted for this filter.</div>`;
          return;
        }

        // Sort homework items grade-wise before rendering
        items.sort((a, b) => {
          const indexA = gradeHierarchy.indexOf(a.grade);
          const indexB = gradeHierarchy.indexOf(b.grade);
          
          // Fallback to end if grade string is not recognized
          const rankA = indexA !== -1 ? indexA : 999;
          const rankB = indexB !== -1 ? indexB : 999;

          return rankA - rankB;
        });

        items.forEach(item => {
          const card = document.createElement('div');
          card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-1.5";
          card.innerHTML = `
            <div class="flex justify-between items-center border-b pb-1.5">
              <span class="font-bold text-slate-800">${item.grade} (${item.sections ? item.sections.join(', ') : ''})</span>
              <span class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-0.5 rounded">${item.subject}</span>
            </div>
            <div class="text-slate-700 text-sm whitespace-pre-line mt-1.5 leading-snug">${formatHomeworkContent(item.content)}</div>
          `;
          container.appendChild(card);
        });
      });
    };
  </script>
</body>
</html>
