<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Principal Portal - Aditya Thaksh International School</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl border border-slate-200 p-6 w-full max-w-md">
      <h3 class="text-lg font-bold text-slate-800 mb-4">Principal Login</h3>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Principal Email</label>
          <input type="email" id="loginEmail" placeholder="thakshinternationalrjy@aditya.ac.in" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <p id="loginError" class="text-xs text-rose-600 font-medium hidden"></p>
        <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg">Sign In</button>
      </form>
      <div class="mt-4 text-center">
        <a href="index.html" class="text-xs text-indigo-600 hover:underline">← Back to Parent Portal</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">Principal Review Panel</h1>
        <p class="text-xs text-indigo-200">Aditya Thaksh International School</p>
      </div>
      <div id="userInfo" class="hidden flex items-center gap-3">
        <span id="userTag" class="text-xs text-indigo-200 font-medium"></span>
        <button onclick="handleLogout()" class="px-2.5 py-1 bg-rose-600 text-white text-xs rounded-md hover:bg-rose-700">Logout</button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-5xl mx-auto px-4 py-8 hidden" id="mainContent">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h2 class="text-xl font-bold text-slate-800">Review & Approvals</h2>
        <p class="text-sm text-slate-500">Edit, approve, and generate WhatsApp text for parents.</p>
      </div>
      <div class="flex items-center gap-3">
        <input type="date" id="filterDate" onchange="listenToPrincipalData()" class="px-3 py-2 border rounded-lg text-sm outline-none">
        <button onclick="copyWhatsAppFormat()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg text-sm flex items-center gap-2">
          <span>📲 Copy WhatsApp Format</span>
        </button>
      </div>
    </div>

    <div id="principalList" class="space-y-4">
      <!-- Firestore Items Render Here -->
    </div>
  </main>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, updateDoc, deleteDoc, doc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBesKlVSBr7a4ClbJ8yLQmFSlkJqDJeuVE",
      authDomain: "homework-9b801.firebaseapp.com",
      projectId: "homework-9b801",
      storageBucket: "homework-9b801.firebasestorage.app",
      messagingSenderId: "718017176358",
      appId: "1:718017176358:web:1842b4a3372c1c170257e7",
      measurementId: "G-XM82NFGJDF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const homeworkCol = collection(db, "homeworks");

    const PRINCIPAL_EMAIL = "thakshinternationalrjy@aditya.ac.in";
    let principalUnsub = null;
    let currentPrincipalData = [];

    onAuthStateChanged(auth, async (user) => {
      const errorMsg = document.getElementById('loginError');

      if (user) {
        if (user.email.toLowerCase() === PRINCIPAL_EMAIL.toLowerCase()) {
          document.getElementById('loginModal').classList.add('hidden');
          document.getElementById('mainContent').classList.remove('hidden');
          document.getElementById('userInfo').classList.remove('hidden');
          document.getElementById('userTag').innerText = user.email;
          listenToPrincipalData();
        } else {
          await signOut(auth);
          if (errorMsg) {
            errorMsg.innerText = "Access Denied: Only the Principal can log in here.";
            errorMsg.classList.remove('hidden');
          }
          document.getElementById('loginModal').classList.remove('hidden');
          document.getElementById('mainContent').classList.add('hidden');
          document.getElementById('userInfo').classList.add('hidden');
        }
      } else {
        document.getElementById('loginModal').classList.remove('hidden');
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('userInfo').classList.add('hidden');
      }
    });

    window.handleLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorMsg = document.getElementById('loginError');
      const loginBtn = document.getElementById('loginBtn');

      if (errorMsg) errorMsg.classList.add('hidden');
      loginBtn.innerText = "Signing in...";

      if (email.toLowerCase() !== PRINCIPAL_EMAIL.toLowerCase()) {
        if (errorMsg) {
          errorMsg.innerText = "Access Denied: Only the Principal email can sign in here.";
          errorMsg.classList.remove('hidden');
        }
        loginBtn.innerText = "Sign In";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        if (errorMsg) {
          errorMsg.innerText = "Invalid password or user credential.";
          errorMsg.classList.remove('hidden');
        }
      } finally {
        loginBtn.innerText = "Sign In";
      }
    };

    window.handleLogout = async function() {
      await signOut(auth);
    };

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById('filterDate').value = new Date().toISOString().split('T')[0];
    });

    window.listenToPrincipalData = function() {
      if (principalUnsub) principalUnsub();
      const selectedDate = document.getElementById('filterDate').value;
      const q = query(homeworkCol, where("date", "==", selectedDate));

      principalUnsub = onSnapshot(q, (snapshot) => {
        currentPrincipalData = [];
        const container = document.getElementById('principalList');
        container.innerHTML = '';

        if (snapshot.empty) {
          container.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-slate-500">No submissions found for this date.</div>`;
          return;
        }

        snapshot.forEach((docSnap) => {
          const item = { id: docSnap.id, ...docSnap.data() };
          currentPrincipalData.push(item);

          const card = document.createElement('div');
          card.className = "bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3";
          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <span class="inline-block bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded mr-2">${item.subject}</span>
                <span class="font-bold text-slate-800">${item.grade} (${item.sections ? item.sections.join(', ') : ''})</span>
                <p class="text-xs text-slate-400 mt-0.5">Teacher: ${item.teacher}</p>
              </div>
              <button onclick="toggleApprove('${item.id}', '${item.status}')" class="px-3 py-1 text-xs font-semibold rounded-full ${item.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                ${item.status === 'approved' ? '✓ Approved' : '⏳ Pending'}
              </button>
            </div>
            <textarea id="edit-${item.id}" rows="2" class="w-full text-sm p-2 border rounded-lg outline-none">${item.content}</textarea>
            <div class="flex justify-end gap-2">
              <button onclick="saveEdit('${item.id}')" class="px-3 py-1 bg-slate-800 text-white rounded-md text-xs">Save Edit</button>
              <button onclick="deleteEntry('${item.id}')" class="px-3 py-1 bg-rose-50 text-rose-600 rounded-md text-xs">Delete</button>
            </div>
          `;
          container.appendChild(card);
        });
      });
    };

    window.saveEdit = async function(id) {
      await updateDoc(doc(db, "homeworks", id), { content: document.getElementById(`edit-${id}`).value });
      alert("Updated!");
    };

    window.toggleApprove = async function(id, status) {
      await updateDoc(doc(db, "homeworks", id), { status: status === 'approved' ? 'pending' : 'approved' });
    };

    window.deleteEntry = async function(id) {
      if (confirm("Delete permanently?")) await deleteDoc(doc(db, "homeworks", id));
    };

    window.copyWhatsAppFormat = function() {
      const approvedItems = currentPrincipalData.filter(item => item.status === 'approved');
      if (approvedItems.length === 0) return alert("No approved entries available.");

      const selectedDate = document.getElementById('filterDate').value;
      const [year, month, day] = selectedDate.split('-');
      const grouped = {};
      approvedItems.forEach(item => {
        if (!grouped[item.subject]) grouped[item.subject] = [];
        grouped[item.subject].push(item);
      });

      let text = `📅 Date: ${day}-${month}-${year}\n\n`;
      for (const [subject, items] of Object.entries(grouped)) {
        text += `📚 Subject: ${subject}\n\n`;
        items.forEach(item => text += `${item.grade} (${item.sections.join(', ')})\n${item.content}\n\n`);
      }

      navigator.clipboard.writeText(text.trim()).then(() => alert("Copied WhatsApp message to clipboard!"));
    };
  </script>
</body>
</html>
